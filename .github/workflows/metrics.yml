# Generates metrics.svg (isometric contribution calendar + most used languages)
# with lowlighter/metrics and commits it to this repo.
# Needs a repository secret named METRICS_TOKEN: a personal access token (classic)
# with the public_repo and read:user scopes.
name: Metrics
# Manual only while the "On GitHub" section is hidden in README.md.
on:
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Contribution calendar and languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: ""
          config_timezone: Europe/Warsaw
          config_display: large
          config_padding: 0, 8
          config_order: isocalendar, languages
          repositories_forks: no
          committer_message: "chore: update metrics"
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_categories: programming
          # jupyter notebook is a file format wrapping Python/R, not a language; templates come from forks
          plugin_languages_ignored: jupyter notebook, html, css, tex, dockerfile, makefile, shell, batchfile, smarty, go template
