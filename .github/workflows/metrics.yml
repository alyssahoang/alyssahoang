# Generates metrics.svg (isometric contribution calendar + most used languages)
# with lowlighter/metrics and commits it to this repo.
# Needs a repository secret named METRICS_TOKEN: a personal access token (classic)
# with the public_repo and read:user scopes.
name: Metrics
on:
  schedule: [{cron: "0 4 * * *"}]   # daily, 04:00 UTC
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Contribution calendar and languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: ""
          config_timezone: Europe/Warsaw
          config_display: large
          config_padding: 0, 8
          committer_message: "chore: update metrics"
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_categories: programming
          plugin_languages_ignored: html, css, tex, dockerfile, makefile, shell, batchfile
